[package]
name = "denizen-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native Rust core engine for Denizen (Minecraft scripting engine)"

[lib]
name = "denizen_core"
crate-type = ["rlib"]

[dependencies]
regex = "1"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
